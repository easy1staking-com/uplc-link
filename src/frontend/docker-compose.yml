version: '3.8'

services:
  plutus-scan:
    build:
      context: .
      dockerfile: Dockerfile
      # All three are NEXT_PUBLIC_* inside the Dockerfile, so they are inlined
      # into the bundle at COMPILE time — setting them under `environment:`
      # below would have no effect. They must be build args.
      #
      # Populate .env.docker, then:
      #   set -a; . ./.env.docker; set +a
      #   CARDANO_NETWORK=preprod \
      #     BLOCKFROST_PROJECT_ID="${BLOCKFROST_PROJECT_ID_PREPROD}" \
      #     docker compose build
      args:
        CARDANO_NETWORK: ${CARDANO_NETWORK:-mainnet}
        BACKEND_URL: ${BACKEND_URL:-http://localhost:8080}
        # Public origin of this deployment; social cards resolve og:image against it.
        BASE_URL: ${BASE_URL:-http://localhost:3000}
        BLOCKFROST_PROJECT_ID: ${BLOCKFROST_PROJECT_ID:?set it to the project id for ${CARDANO_NETWORK:-mainnet} (see .env.docker); registry submission breaks without it}
    container_name: plutus-scan
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    # Resource limits for Aiken builds
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '2'
          memory: 2G
    # Volume for caching Aiken installations
    volumes:
      - aiken-cache:/root/.aiken
      - build-cache:/tmp
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  aiken-cache:
    driver: local
  build-cache:
    driver: local
